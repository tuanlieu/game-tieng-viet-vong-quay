name: Triển khai GitHub Pages có kiểm soát
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.ALLOW_PRODUCTION_DEPLOY == 'true' && vars.BACKEND_ACCEPTANCE_VERIFIED == 'true' && vars.BROWSER_QA_VERIFIED == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_GOOGLE_ENABLED: ${{ vars.VITE_GOOGLE_ENABLED }}
      VITE_FACEBOOK_ENABLED: ${{ vars.VITE_FACEBOOK_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: npm run check
      - run: npm run scan:secrets
      - run: npm audit --audit-level=high
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
